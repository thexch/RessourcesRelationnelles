name: CI Ressources Relationnelles

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Tests et build du backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://admin:password123@localhost:5433/db_ressources?schema=public
      JWT_SECRET: github-actions-test-secret-not-for-production
      FRONTEND_URL: http://localhost:3000
      PORT: 3001

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Generer Prisma Client
        run: npx prisma generate --generator client

      - name: Lancer les tests du backend
        run: npm test

      - name: Compiler le backend
        run: npm run build

  frontend:
    name: Tests et build du frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: github-actions-test-secret-not-for-production
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lancer les tests du frontend
        run: npm test

      - name: Compiler le frontend
        run: npm run build
